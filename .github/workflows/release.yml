name: Check upstream and release

on:
  schedule:
    # Every day at 10:15 Asia/Shanghai (02:15 UTC).
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build the current version even when no update is found
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: netbird-auto-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.publish.outputs.commit || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest NetBird release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json=$(curl --fail --silent --show-error --location \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/netbirdio/netbird/releases/latest)

          latest_tag=$(jq -er '.tag_name' <<<"${release_json}")
          latest_version=${latest_tag#v}
          current_version=$(sed -n 's/^version="\([^"]*\)"/\1/p' INFO)

          if [[ -z "${current_version}" || ! "${latest_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: current='${current_version}', latest='${latest_version}'" >&2
            exit 1
          fi

          # Do not update INFO until both required upstream archives exist.
          assets=$(jq -r '.assets[].name' <<<"${release_json}")
          for arch in amd64 arm64; do
            asset="netbird_${latest_version}_linux_${arch}.tar.gz"
            if ! grep -Fxq "${asset}" <<<"${assets}"; then
              echo "Upstream release ${latest_tag} is missing ${asset}; retrying on the next run." >&2
              exit 1
            fi
          done

          echo "version=${latest_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${latest_version}" == "${current_version}" ]]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            echo "NetBird ${latest_version} is already current."
          else
            sed -i "s/^version=.*/version=\"${latest_version}\"/" INFO
            sed -i "s/^changelog=.*/changelog=\"Update to v${latest_version}\"/" INFO
            echo "updated=true" >> "${GITHUB_OUTPUT}"
            echo "Updating NetBird ${current_version} -> ${latest_version}."
          fi

      - name: Commit version update
        id: publish
        if: steps.check.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add INFO
          git commit -m "chore: update NetBird to ${VERSION}"
          git push
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.updated == 'true' || inputs.force_build == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout updated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}

      - name: Build SPK
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${ARCH}" == "arm64" ]]; then
            sed -i 's/^arch=.*/arch="rtd1296 rtd1619b armada37xx armv8"/' INFO
            sed -i 's/^os_min_ver=.*/os_min_ver="7.1-42661"/' INFO
          fi

          expected_signature_hash=$(jq -er '.sha256' scripts/real-start-stop-status.sig)
          echo "${expected_signature_hash}  scripts/real-start-stop-status" | sha256sum --check --strict

          archive=$(mktemp)
          mkdir -p package/bin
          chmod +x package/bin/netbird-service
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/netbirdio/netbird/releases/download/v${VERSION}/netbird_${VERSION}_linux_${ARCH}.tar.gz" \
            --output "${archive}"
          tar -xzf "${archive}" -C package/bin netbird
          chmod +x package/bin/netbird

          tar -czf package.tgz -C package .
          tar -cf "Netbird-v${VERSION}-${ARCH}-DSM7.spk" \
            INFO PACKAGE_ICON.PNG PACKAGE_ICON_256.PNG \
            conf scripts WIZARD_UIFILES package.tgz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbird-${{ matrix.arch }}-${{ needs.check.outputs.version }}
          path: ./*.spk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: netbird-*-${{ needs.check.outputs.version }}
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" >/dev/null 2>&1 || \
            gh release create "v${VERSION}" --title "NetBird v${VERSION}" \
              --notes "Automated Synology DSM 7 packages for NetBird v${VERSION}."
          gh release upload "v${VERSION}" ./*.spk --clobber
